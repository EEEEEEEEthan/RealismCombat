[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "realism-combat-agent"
version = "0.1.0"
description = "RealismCombat 项目 egent 开发工作流入口"
requires-python = ">=3.13"
dependencies = [
    "egent @ git+https://github.com/EEEEEEEEthan/egent.git",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
realism-combat-develop = "main:run"

[tool.setuptools]
package-dir = {"" = ".egent"}
py-modules = [
    "_common",
    "conversation_printer",
    "godot_game_tools",
    "main",
    "workflow_egent_develop",
    "workflow_gameplay_develop",
    "workflow_review",
]

[tool.pytest.ini_options]
testpaths = [".egent/tests"]
asyncio_mode = "auto"
pythonpath = [".egent"]

[tool.pylint.main]
init-hook = "import sys; from pathlib import Path; root = Path('.').resolve(); sys.path[:0] = [str(root), str(root / 'addons' / 'godot_runtime_mcp'), str(root / '.egent')]"

[tool.pylint."messages control"]
disable = ["duplicate-code"]

[tool.pylint.format]
max-line-length = 160
