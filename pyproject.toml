[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "realism-combat-agent"
version = "0.1.0"
description = "RealismCombat 的 egent 聊天 CLI"
requires-python = ">=3.13"
dependencies = [
    "egent @ git+https://github.com/EEEEEEEEthan/egent.git",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
realism-combat-develop = "main:run"

[tool.setuptools]
package-dir = {"" = ".egent"}
py-modules = [
    "_bootstrap",
    "conversation_printer",
    "hot_reload",
    "main",
    "shell_tools",
    "workflow",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".egent"]

[tool.pylint.main]
source-roots = [".egent"]

[tool.pylint."messages control"]
disable = ["duplicate-code"]

[tool.pylint.format]
max-line-length = 160
